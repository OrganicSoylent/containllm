# APISIX route setup for ollama-service-large
#
# This Job runs as a Helm post-install/post-upgrade hook and calls the APISIX
# Admin API to register an upstream and a catch-all route so every request that
# enters APISIX is forwarded to ollama-service-large.
#
# How to use:
#   Option A (recommended) – include via the Helm values file:
#     Copy the Job spec below into apisix_chart_values.yaml under:
#       extraDeploy:
#         - <paste job here>
#
#   Option B – apply separately after `helm install`:
#     kubectl apply -f apisix/ollama-route.yaml -n <apisix-namespace>
#
# Before applying, set the two variables below to match your deployment:
#   APISIX_RELEASE_NAME  – the Helm release name (default: "apisix")
#   APISIX_NAMESPACE     – the namespace APISIX is deployed into (default: "apisix")
#
# The Admin API key matches the default in apisix_chart_values.yaml:
#   apisix.admin.credentials.admin: edd1c9f034335f136f87ad84b625c8f1
# Change it here if you changed it in the values file.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: apisix-ollama-route-setup
  # Change to the namespace where APISIX is deployed
  namespace: default
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: route-setup
          image: curlimages/curl:8.7.1
          command:
            - sh
            - -c
            - |
              set -e

              # Admin API base URL.
              # The service name follows the Helm chart convention:
              #   <release-name>-apisix-admin.<namespace>.svc.cluster.local
              # Adjust RELEASE and NAMESPACE to match your deployment.
              RELEASE="apisix"
              NAMESPACE="default"
              ADMIN_URL="http://${RELEASE}-apisix-admin.${NAMESPACE}.svc.cluster.local:9180"
              API_KEY="edd1c9f034335f136f87ad84b625c8f1"

              echo "Waiting for APISIX Admin API to be ready..."
              until curl -sf -o /dev/null "${ADMIN_URL}/apisix/admin/routes" \
                    -H "X-API-KEY: ${API_KEY}"; do
                sleep 3
              done
              echo "Admin API is ready."

              # 1. Create upstream pointing to ollama-service-large
              curl -sf -X PUT "${ADMIN_URL}/apisix/admin/upstreams/ollama-large" \
                -H "X-API-KEY: ${API_KEY}" \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "ollama-large-upstream",
                  "type": "roundrobin",
                  "nodes": {
                    "ollama-service-large.ollama.svc.cluster.local:11434": 1
                  },
                  "scheme": "http",
                  "pass_host": "pass"
                }'
              echo "Upstream created."

              # 2. Create a catch-all route — every request entering APISIX is
              #    forwarded to the ollama-service-large upstream.
              curl -sf -X PUT "${ADMIN_URL}/apisix/admin/routes/ollama-route" \
                -H "X-API-KEY: ${API_KEY}" \
                -H "Content-Type: application/json" \
                -d '{
                  "name": "ollama-route",
                  "uri": "/*",
                  "methods": ["GET","POST","PUT","DELETE","PATCH","HEAD","OPTIONS"],
                  "upstream_id": "ollama-large",
                  "status": 1
                }'
              echo "Route created. All traffic will now be forwarded to ollama-service-large."
